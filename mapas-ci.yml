# Copy into the repo as .github/workflows/ci.yml
#
# Minimal CI so that automatic merging makes sense: the "build" job must be
# a required check in branch protection (see playbook, section "Push, PR and automatic merge").
# Adjust the action and Java versions to the current ones when you copy it,
# and extend the job after the spike (NDK, CMake, instrumented tests).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prohibir dependencias propietarias (Play Services, Firebase)
        run: |
          if grep -rEi "play-services|firebase|com\.google\.android\.gms" \
              --include='*.gradle' --include='*.kts' --include='*.toml' .; then
            echo "Proprietary dependency detected: not allowed in the foss flavor"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint, unit tests and build
        run: ./gradlew lint test assembleDebug
