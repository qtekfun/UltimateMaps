# Builds the signed release APK for a version tag (vX.Y.Z or vX.Y.Z-rc.N) and publishes it as a
# GitHub Release, with that version's notes taken from CHANGELOG.md. See RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The native core pins exact NDK and CMake versions (native-comaps/build.gradle.kts); do not rely on what the image ships.
      - name: Instalar NDK y CMake exactos
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.31.6"

      # The CoMaps core is a submodule (pinned tag) and its generated data is not versioned.
      # The script initializes only the nested submodules it needs (requires network and PyPI).
      - name: Prepare the CoMaps core
        run: |
          git submodule update --init third_party/comaps
          bash scripts/comaps-prepare.sh

      - name: Check that the tag matches appVersion
        run: |
          version=$(grep '^appVersion=' gradle.properties | cut -d= -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match appVersion $version"; exit 1; }

      - name: Check that CHANGELOG.md has notes for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {found=1; next} found && /^## \[/ {exit} found {print}' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no notes for $version"; exit 1; }

      - name: Check, build and sign the release APK
        env:
          UM_KEYSTORE_BASE64: ${{ secrets.UM_KEYSTORE_BASE64 }}
          UM_KEYSTORE_PASSWORD: ${{ secrets.UM_KEYSTORE_PASSWORD }}
          UM_KEY_ALIAS: ${{ secrets.UM_KEY_ALIAS }}
          UM_KEY_PASSWORD: ${{ secrets.UM_KEY_PASSWORD }}
        run: |
          # Without a key nothing is published: an unsigned APK cannot be installed as an update over a signed one.
          test -n "$UM_KEYSTORE_BASE64" || { echo "Missing the UM_KEYSTORE_BASE64 secret"; exit 1; }
          export UM_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$UM_KEYSTORE_BASE64" | base64 -d > "$UM_KEYSTORE_FILE"
          ./gradlew test :app:lintFossRelease :app:assembleFossRelease
          rm -f "$UM_KEYSTORE_FILE"

      - name: Publicar la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="UltimateMaps-$version.apk"
          cp app/build/outputs/apk/foss/release/app-foss-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          prerelease=""
          case "$version" in *-rc.*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" --title "Mapas $version" --notes-file notes.md $prerelease
